<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>학원 보강 수첩</title>
<meta name="theme-color" content="#ffb4c6">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보강 수첩">
<link rel="icon" href="icon-192.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f0;--card:#fff;--ink:#4a3b35;--sub:#9a8a82;--line:#f0e2d8;--pink:#ff8fab;--red:#ff5d73;--yel:#ffd166;--grn:#5cc98a;--blu:#6aa9ff;--pur:#b48cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Gaegu',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:20px;font-weight:700;padding-bottom:110px;background-image:repeating-linear-gradient(transparent 0 31px,#f3e3d6 31px 32px)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.j{font-family:'Gamja Flower',system-ui,sans-serif;font-size:1.15em}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#ffc2d1,#ffe0b5);padding:14px 0 12px;border-radius:0 0 26px 26px;box-shadow:0 4px 14px #f5c8b555}
.top{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-family:'Gamja Flower';font-size:29.3px;flex:1;letter-spacing:-.5px}
.top h1 small{font-size:15.6px;color:#a06a6a;font-family:'Gaegu';margin-left:4px}
.ib{width:40px;height:40px;border-radius:14px;background:#fff9;font-size:20px}
.kids{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.kids button{background:#fff9;border-radius:99px;padding:6px 14px;font-family:'Gamja Flower';white-space:nowrap;font-size:18.3px}
.kids button.on{background:#fff;box-shadow:0 2px 6px #e0a0a055;color:#e0557a}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.sum div{background:#fff;border-radius:18px;padding:10px 8px;text-align:center;box-shadow:0 2px 8px #f0c9b533}
.sum b{display:block;font-family:'Gaegu';font-weight:700;font-size:31.7px;line-height:1.1}
.sum span{font-size:18px;color:var(--sub)}
.sum .r b{color:var(--red)} .sum .y b{color:#f0a020} .sum .g b{color:var(--grn)}
.tabs{display:flex;gap:6px;margin:14px 0 10px;background:#fff;border-radius:16px;padding:5px;box-shadow:0 2px 8px #f0c9b533}
.tabs button{flex:1;padding:9px 0;border-radius:12px;font-family:'Gamja Flower';font-size:18.9px;color:var(--sub)}
.tabs button.on{background:#ffe3ea;color:#d94b72}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 3px 12px #f0c9b533;margin-bottom:12px}
/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font-family:'Gamja Flower';font-size:25.6px}
.calh button{width:38px;height:38px;border-radius:12px;background:#fff1ea;font-size:18px}
.calh .today{width:auto;padding:0 12px;font-size:17.1px;font-family:'Gamja Flower'}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:15.2px;color:var(--sub);padding:2px 0 4px;font-family:'Gamja Flower'}
.dow:first-child{color:var(--red)} .dow:last-child{color:var(--blu)}
.day{min-height:74px;border-radius:12px;background:#fffaf6;padding:3px 3px 4px;display:flex;flex-direction:column;align-items:stretch;text-align:left;border:2px solid transparent;overflow:hidden}
.day.out{opacity:.35}
.day.td{border-color:var(--pink);background:#fff0f4}
.day.sel{border-color:#d94b72;box-shadow:0 0 0 2px #ffd3df}
.day .n{font-size:15.2px;font-family:'Gamja Flower';padding-left:2px}
.day.su .n{color:var(--red)} .day.sa .n{color:var(--blu)}
.evs{display:flex;flex-wrap:wrap;gap:1px;margin-top:1px}
.ev{position:relative;font-size:19px;line-height:1;width:24px;height:24px;display:grid;place-items:center;border-radius:8px}
.ev.ab{background:#ffe5e8}
.ev.ab::after{content:'';position:absolute;inset:3px;background:linear-gradient(45deg,transparent 45%,#ff5d73 45%,#ff5d73 57%,transparent 57%);border-radius:4px}
.ev.mk{background:#fff4c9}
.ev.mk::after{content:'⭐';position:absolute;right:-4px;top:-5px;font-size:11px}
.ev.mk.dn{background:#dff6e7}
.ev.mk.dn::after{content:'✅'}
.ev.rg{opacity:.28;font-size:14px;width:17px;height:17px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--sub);margin-top:10px;align-items:center}
.legend .ev{transform:scale(.8)}
/* day sheet & lists */
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dhead b{font-family:'Gamja Flower';font-size:23.2px;flex:1}
.item{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:#fffaf6;margin-bottom:7px;border-left:6px solid var(--c,#ccc)}
.item .ic{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:#fff;border-radius:14px;flex:none;box-shadow:0 1px 4px #0001}
.item .tx{flex:1;min-width:0}
.item .tx b{font-family:'Gamja Flower';font-size:20.1px}
.item .tx div{font-size:16.2px;color:var(--sub);margin-top:2px}
.item .tx .lk{color:var(--ink)}
.tag{display:inline-block;font-size:14.6px;padding:2px 8px;border-radius:99px;font-family:'Gamja Flower';margin-left:4px;vertical-align:2px}
.t-wait{background:#ffe1e5;color:#e0435b}
.t-plan{background:#fff0c2;color:#c48400}
.t-done{background:#d9f4e3;color:#2f9a5c}
.t-none{background:#eee;color:#888}
.t-ab{background:#ffe1e5;color:#e0435b}
.t-mk{background:#fff0c2;color:#c48400}
.sbtn{padding:8px 12px;border-radius:12px;background:#ffe3ea;color:#d94b72;font-family:'Gamja Flower';font-size:17.1px;white-space:nowrap}
.sbtn.y{background:#fff0c2;color:#b37800}
.sbtn.g{background:#e3f5ea;color:#2f9a5c}
.sbtn.gr{background:#f2ece8;color:#8a7a72}
h3{font-family:'Gamja Flower';font-size:22px;margin:4px 0 10px;font-weight:normal}
h3 small{font-family:'Gaegu';font-size:15.6px;color:var(--sub);margin-left:4px}
.empty{color:var(--sub);text-align:center;padding:18px 6px;font-size:17.4px}
.empty .big{font-size:42px;display:block;margin-bottom:4px}
.acgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.acc{border-radius:18px;padding:12px 10px;text-align:center;background:color-mix(in srgb,var(--c) 16%,#fff);border:2px solid color-mix(in srgb,var(--c) 40%,#fff);position:relative}
.acc .ic{font-size:40px;line-height:1.1}
.acc b{display:block;font-family:'Gamja Flower';font-size:20.7px;margin-top:4px}
.acc .dd{font-size:15px;color:var(--sub)}
.acc .cnt{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-family:'Gamja Flower';border-radius:99px;min-width:26px;height:26px;padding:0 7px;display:grid;place-items:center;font-size:17.1px;box-shadow:0 2px 6px #ff5d7366;animation:bob 1.6s ease-in-out infinite}
.acc .kd{font-size:14.4px;color:var(--sub)}
@keyframes bob{50%{transform:translateY(-3px)}}
.acc.add{background:#fff;border:2px dashed #f0c9b5;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;font-family:'Gamja Flower';font-size:1.15em}
.acc.add span{font-size:34px}
/* fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:20}
.fab button{padding:14px 20px;border-radius:99px;font-family:'Gamja Flower';font-size:20.7px;box-shadow:0 6px 16px #0002;color:#fff;white-space:nowrap}
.fab .a{background:linear-gradient(135deg,#ff7b93,#ff5d73)}
.fab .m{background:linear-gradient(135deg,#ffc94d,#f5a623)}
/* modal */
.ov{position:fixed;inset:0;background:#4a3b3566;display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h2{font-family:'Gamja Flower';font-size:25.6px;margin:0 0 12px;font-weight:normal;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto;font-size:20px;width:36px;height:36px;border-radius:12px;background:#f6efea}
.lbl{font-family:'Gamja Flower';font-size:17.7px;color:#8a6a62;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:14px;background:#f8f1ec;font-size:18px;border:2px solid transparent}
.chip.on{background:#ffe3ea;border-color:#ff8fab;color:#c93d65;font-weight:bold}
.chip .e{font-size:19px;vertical-align:-2px;margin-right:3px}
.inp{width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:#fffaf6;outline:none}
.inp:focus{border-color:var(--pink)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:200px;overflow:auto;padding:2px}
.icons button{font-size:26px;height:46px;border-radius:12px;background:#f8f1ec;border:2px solid transparent}
.icons button.on{border-color:var(--pink);background:#ffe3ea}
.colors{display:flex;gap:7px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #eee}
.colors button.on{box-shadow:0 0 0 3px #4a3b35}
.days{display:flex;gap:5px}
.days button{flex:1;padding:9px 0;border-radius:12px;background:#f8f1ec;font-family:'Gamja Flower';font-size:1.15em}
.days button.on{background:#ff8fab;color:#fff}
.go{width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,#ff8fab,#ff6b8b);color:#fff;font-family:'Gamja Flower';font-size:22px;margin-top:18px;box-shadow:0 4px 12px #ff8fab55}
.go.y{background:linear-gradient(135deg,#ffc94d,#f5a623);box-shadow:0 4px 12px #f5a62355}
.del{width:100%;padding:11px;border-radius:14px;color:#d04a5a;background:#fff0f1;margin-top:8px;font-family:'Gamja Flower';font-size:1.15em}
.prev{display:flex;align-items:center;gap:10px;background:#fff8f2;border-radius:16px;padding:10px;margin-top:4px}
.prev .ic{font-size:34px}
.toggle{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#fff8e6;font-family:'Gamja Flower';color:#a87500;font-size:1.15em}
.toggle input{width:20px;height:20px;accent-color:#f5a623}
.mkbox{background:#fffbea;border-radius:16px;padding:4px 12px 12px;margin-top:8px}
.pick{max-height:260px;overflow:auto}
.pick .item{cursor:pointer;border:2px solid transparent}
.pick .item.on{border-color:#f5a623;background:#fff6dc}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:#4a3b35;color:#fff;padding:11px 18px;border-radius:99px;font-family:'Gamja Flower';z-index:99;transition:.3s;white-space:nowrap;font-size:1.15em}
.toast.on{transform:translateX(-50%) translateY(0)}
.stk{display:inline-block;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}}
.note{font-size:15px;color:var(--sub);line-height:1.5}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mini span{background:#fff;border-radius:99px;padding:4px 10px;font-size:15.6px;box-shadow:0 1px 4px #0001}
@media(max-width:420px){.day{min-height:62px}.ev{width:20px;height:20px;font-size:16px}.ev.rg{display:none}.top h1{font-size:21px}.fab button{padding:13px 16px;font-size:19.2px}}
.tb{display:inline-grid;place-items:center;background:var(--red);color:#fff;border-radius:99px;min-width:22px;height:22px;font-size:14px;margin-left:4px;padding:0 6px;vertical-align:2px;animation:bob 1.4s ease-in-out infinite}
.postit{position:relative;background:#fff1a8;border-radius:6px 6px 22px 6px;padding:20px 14px 14px;margin:6px 4px 16px;box-shadow:0 8px 18px #e6b43a44, inset 0 -6px 0 #f5df7a;transform:rotate(-1deg);border:3px solid #ff5d73}
.postit::before{content:'';position:absolute;top:-12px;left:50%;width:110px;height:24px;margin-left:-55px;background:#ff9fb3cc;transform:rotate(2deg);border-radius:3px}
.postit.ok{border-color:#7fd67a;background:#eafbe8;box-shadow:0 6px 14px #7fd67a33;text-align:center}
.postit.ok::before{background:#a8e6a3cc}
.pt-h{font-family:'Gamja Flower';font-size:29px;color:#e0304d;display:flex;align-items:center;gap:8px}
.postit.ok .pt-h{color:#2f9a5c;justify-content:center;font-size:25px}
.pt-n{background:#ff3d5a;color:#fff;border-radius:99px;min-width:40px;height:40px;display:inline-grid;place-items:center;font-family:'Gaegu';font-weight:700;font-size:28px;animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 0 0 #ff3d5a88}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 0 8px #ff3d5a00}}
.pt-s{color:#a0742a;font-size:17px;margin:2px 0 10px}
.pt-i{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px;margin-top:8px;border-left:7px solid var(--c);box-shadow:0 2px 6px #0000000d;cursor:pointer}
.pt-i .ic{font-size:36px;width:52px;height:52px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,#fff);border-radius:16px;flex:none}
.pt-i .tx{flex:1;min-width:0}
.pt-i .tx b{font-family:'Gamja Flower';font-size:24px}
.pt-i .d{display:block;font-size:16.5px;color:#7a6a62}
.pt-i .dd{font-family:'Gaegu';font-weight:700;color:#e0304d;text-align:center;font-size:17px;line-height:1.1;flex:none}
.pt-i .dd.hot{background:#ff3d5a;color:#fff;border-radius:12px;padding:4px 7px}
.pt-i .sbtn{font-size:16px;line-height:1.15;padding:9px 11px;background:linear-gradient(135deg,#ffc94d,#f5a623);color:#fff;box-shadow:0 3px 8px #f5a62366}
.pt-soon{margin-top:10px;font-size:17px;color:#8a6500}
.soon{background:#fff8d6;border:2px dashed #f5c84a;border-radius:16px;padding:9px 12px;margin-bottom:12px;font-size:17px;color:#8a6500;display:flex;flex-wrap:wrap;gap:4px 10px}
.soon.ok{background:#eafbe8;border-color:#a8e6a3;color:#2f9a5c}
.cloud{height:40px;padding:0 10px;border-radius:14px;background:#fff9;font-size:16px;font-family:'Gaegu';font-weight:700;white-space:nowrap}
.cloud.off{background:#ffe1e5}
.share{background:#eef6ff;border-radius:16px;padding:12px;font-size:17px;line-height:1.45}
.share .code{margin-top:8px;font-size:16px}.share .code b{font-size:20px;letter-spacing:1px;background:#fff;border-radius:8px;padding:1px 8px}
.share .st{font-size:15px;color:#5a7}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1>📒 학원 보강 수첩<small>결강·보강 한눈에</small></h1><button class="cloud" id="cloud" title="온라인 저장">☁️</button><button class="ib" id="setBtn" title="설정">⚙️</button></div>
  <div class="kids" id="kids"></div>
  <div class="sum" id="sum"></div>
</div></header>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button data-t="cal">📅 달력</button><button data-t="list">📋 보강 목록</button><button data-t="ac">🏫 학원</button>
  </div>
  <div id="main"></div>
</div>
<div class="fab"><button class="a" id="fabA">❌ 결강 넣기</button><button class="m" id="fabM">⭐ 보강 넣기</button></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='academy_makeup_v1';
const ICONS=['🎹','🎻','🎸','🥁','🎤','🎺','🎵','🏊','🥋','⚽','🏀','⚾','🎾','🏸','🏑','🤸','🩰','⛸️','🚴','🧗','🏓','🤺','🎨','✏️','🧶','🏺','📐','➗','🔢','🍎','🇺🇸','🇬🇧','🗽','🦉','💬','🔤','🌍','📖','✍️','📚','🧪','🔬','🔭','💻','🤖','🧩','♟️','🧠','🗣️','🇨🇳','🇯🇵','🎭','📸','🍳','🌱','🦄','⭐'];
const KW=[[/피아노|건반/,'🎹'],[/바이올린|첼로|현악|오케/,'🎻'],[/기타|우쿨/,'🎸'],[/드럼|난타/,'🥁'],[/보컬|노래|성악|합창/,'🎤'],[/플룻|트럼펫|관악|색소폰|클라리넷/,'🎺'],[/음악|리코더|오카리나/,'🎵'],[/수영/,'🏊'],[/태권|합기|유도|검도|주짓수|복싱/,'🥋'],[/축구|풋살/,'⚽'],[/농구/,'🏀'],[/야구/,'⚾'],[/테니스/,'🎾'],[/배드민턴/,'🏸'],[/하키/,'🏑'],[/체조|줄넘기|체육|짐/,'🤸'],[/발레|무용|댄스|방송/,'🩰'],[/스케이트|빙상|피겨/,'⛸️'],[/자전거|사이클/,'🚴'],[/클라이밍/,'🧗'],[/탁구/,'🏓'],[/펜싱/,'🤺'],[/미술|그림|드로잉/,'🎨'],[/서예|한자|글씨/,'✍️'],[/공예|도예|만들기/,'🏺'],[/수학|연산|사고력|셈/,'📐'],[/영어|파닉스/,'🍎'],[/중국/,'🇨🇳'],[/일본/,'🇯🇵'],[/국어|논술|독서|책/,'📖'],[/과학|실험/,'🧪'],[/코딩|컴퓨터|소프트/,'💻'],[/로봇/,'🤖'],[/바둑|체스|보드/,'♟️'],[/스피치|발표/,'🗣️'],[/연기|뮤지컬|연극/,'🎭'],[/요리|쿠킹/,'🍳'],[/학습지|구몬|눈높이|씽크|공부방/,'✏️'],[/웅변/,'🗣️']];
const COLORS=['#ff8fab','#ff9e5e','#ffc94d','#7fd67a','#4fc3b5','#6aa9ff','#9b8cff','#e58fff','#b08968','#8a9bb0'];
const KIDEM=['🐰','🐻','🐱','🐶','🐥','🦊','🐼','🐯','🐨','🐹'];
const REASONS=[['🤒','아파서'],['✈️','여행·가족 일'],['🏫','학교 행사'],['🏢','학원 사정'],['🎉','공휴일'],['😴','그냥 빠짐'],['✏️','기타']];
const DOW='일월화수목금토';

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.acads){if(!s.v2){s.acads.forEach(a=>{if(a.ico==='🔤'&&/영어/.test(a.name))a.ico='🍎'});s.v2=1}return s}}catch(e){}const seed=[['피아노','🎹','#ff8fab'],['줄넘기','🤸','#ff9e5e'],['하키','🏑','#4fc3b5'],['영어','🍎','#6aa9ff'],['수영','🏊','#7fd67a'],['학습지','✏️','#9b8cff']];
  return {v2:1,kids:[],acads:seed.map(([name,ico,color])=>({id:uid(),name,ico,color,days:[],time:''})),abs:[],tab:'ac',kid:'all'}}
function save(){S.tab=tab;S.kid=kid;const d=dataStr();if(d!==S.lastD){S.lastD=d;S.at=Date.now();queuePush()}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* ---------- 온라인 저장 (Firebase RTDB, 가족 코드) ---------- */
const DB='https://matchmaker-28187-default-rtdb.asia-southeast1.firebasedatabase.app/academy_makeup/';
const dataStr=()=>JSON.stringify({kids:S.kids,acads:S.acads,abs:S.abs});
const newCode=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let r='';const a=crypto.getRandomValues(new Uint8Array(12));a.forEach(v=>r+=c[v%c.length]);return r};
const shareURL=()=>location.origin+location.pathname+'#f='+S.code;
let pushT=null,syncState='',pulling=false,initAt=0;
function setCloud(st){syncState=st;const b=document.getElementById('cloud');if(!b)return;b.textContent={ok:'☁️✓',busy:'☁️…',off:'☁️⚠️'}[st]||'☁️';b.className='cloud '+st}
function queuePush(){if(!S.code)return;clearTimeout(pushT);setCloud('busy');pushT=setTimeout(push,700)}
async function push(){try{const r=await fetch(DB+S.code+'.json',{method:'PUT',body:JSON.stringify({at:S.at,d:S.lastD})});if(!r.ok)throw 0;setCloud('ok')}catch(e){setCloud('off')}}
async function pull(force){if(!S.code||pulling)return;pulling=true;
  try{const r=await fetch(DB+S.code+'.json?x='+Date.now());if(!r.ok)throw 0;const j=await r.json();
    if(force===true&&(S.at||0)>initAt)force=false;
    if(j&&j.d&&(force||j.at>(S.at||0))){const d=JSON.parse(j.d);S.kids=d.kids||[];S.acads=d.acads||[];S.abs=d.abs||[];S.lastD=j.d;S.at=j.at;
      if(kid!=='all'&&!kidOf(kid))kid='all';try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!$('#ov').classList.contains('on'))render();setCloud('ok');return 'got'}
    else if(!j||!j.d||j.at<(S.at||0)){await push();return 'pushed'}
    setCloud('ok')}catch(e){setCloud('off')}finally{pulling=false}}
function initSync(){
  const m=location.hash.match(/f=([a-z0-9]{10,16})/);
  let force=false;
  if(m&&m[1]!==S.code){S.code=m[1];force=true}
  const lost=!S.code&&!m&&matchMedia('(display-mode: standalone)').matches;
  if(!S.code){S.code=newCode()}
  if(lost)setTimeout(()=>{openSet();toast('기록이 안 보이면 「다른 가족 코드로 바꾸기」에 코드를 넣어요')},800);
  history.replaceState(null,'',shareURL());initAt=S.at||0;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  pull(force).then(r=>{if(force&&r==='got')toast('☁️ 우리 가족 기록을 불러왔어요!')});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
  window.addEventListener('focus',()=>pull());
  window.addEventListener('hashchange',()=>{const m=location.hash.match(/f=([a-z0-9]{10,16})/);if(m&&m[1]!==S.code){S.code=m[1];pull(true)}});
  setInterval(()=>{if(!document.hidden)pull()},30000);
}
async function shareLink(){const u=shareURL();
  if(navigator.share){try{await navigator.share({title:'📒 학원 보강 수첩',text:'우리 집 학원 보강 수첩 링크예요',url:u});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(u);toast('🔗 링크 복사했어요! 카톡에 붙여넣기')}catch(e){prompt('이 링크를 복사하세요',u)}}
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=load();
let tab=S.tab||'cal', kid=S.kid||'all', ym=null, selDay=null;
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fmt=s=>{if(!s)return'';const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')'};
const dday=s=>{const n=Math.round((pd(s)-pd(today()))/864e5);return n===0?'오늘':n===1?'내일':n===-1?'어제':n>0?n+'일 뒤':(-n)+'일 전'};
const acOf=id=>S.acads.find(a=>a.id===id);
const kidOf=id=>S.kids.find(k=>k.id===id);
const suggest=n=>{for(const[r,e]of KW)if(r.test(n))return e;return null};
function visAcads(){return S.acads.filter(a=>kid==='all'||a.kid===kid)}
function visAbs(){const ids=new Set(visAcads().map(a=>a.id));return S.abs.filter(x=>ids.has(x.acad))}
function status(x){if(x.none)return'none';if(!x.mk)return'wait';return x.mk<=today()?'done':'plan'}
const ST={wait:['보강 대기','t-wait'],plan:['보강 예정','t-plan'],done:['보강 완료','t-done'],none:['보강 없음','t-none']};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}

/* ---------- render ---------- */
function render(){save();renderKids();renderSum();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  {const w=visAbs().filter(x=>status(x)==='wait').length,lb=$('#tabs [data-t=list]');lb.innerHTML='📋 보강 목록'+(w?`<span class="tb">${w}</span>`:'')}
  if(!S.acads.length&&tab!=='ac'){tab='ac'}
  ({cal:renderCal,list:renderList,ac:renderAc})[tab]();
}
function renderKids(){const k=$('#kids');
  if(S.kids.length<2){k.style.display='none';if(kid!=='all'&&!kidOf(kid))kid='all';return}
  k.style.display='flex';
  k.innerHTML=`<button data-k="all" class="${kid==='all'?'on':''}">👨‍👩‍👧 모두</button>`+S.kids.map(x=>`<button data-k="${x.id}" class="${kid===x.id?'on':''}">${x.em} ${esc(x.name)}</button>`).join('');
  k.querySelectorAll('button').forEach(b=>b.onclick=()=>{kid=b.dataset.k;render()});
}
function renderSum(){const A=visAbs(),t=today();
  const w=A.filter(x=>status(x)==='wait').length;
  const end=new Date();end.setDate(end.getDate()+7);const e=ds(end);
  const up=A.filter(x=>x.mk&&!x.none&&x.mk>=t&&x.mk<=e).length;
  const m=t.slice(0,7);const dn=A.filter(x=>status(x)==='done'&&x.mk.slice(0,7)===m).length;
  $('#sum').innerHTML=`<div class="r"><b>${w}</b><span>🔴 보강 대기</span></div><div class="y"><b>${up}</b><span>⭐ 7일 안 보강</span></div><div class="g"><b>${dn}</b><span>✅ 이번 달 완료</span></div>`;
}
function eventsOn(d){const out=[];const A=visAbs();
  A.forEach(x=>{if(x.date===d)out.push({k:'ab',x});if(x.mk===d&&!x.none)out.push({k:'mk',x})});
  return out}
function regularOn(d){const w=pd(d).getDay();return visAcads().filter(a=>(a.days||[]).includes(w)&&!visAbs().some(x=>x.acad===a.id&&x.date===d))}
function pendHTML(big){const A=visAbs(),t=today();
  const wait=A.filter(x=>status(x)==='wait').sort((a,b)=>a.date.localeCompare(b.date));
  const e=new Date();e.setDate(e.getDate()+7);const es=ds(e);
  const soon=A.filter(x=>status(x)==='plan'&&x.mk<=es).sort((a,b)=>a.mk.localeCompare(b.mk));
  if(!wait.length&&!big){return soon.length?`<div class="soon">⭐ 곧 보강 · `+soon.map(x=>{const a=acOf(x.acad);return `<span>${a.ico} ${esc(a.name)} <b>${fmt(x.mk)}</b>${x.mkTime?' '+esc(x.mkTime):''}</span>`}).join('')+`</div>`:`<div class="soon ok">🎉 밀린 보강 없음! 아주 깔끔해요</div>`}
  if(!wait.length)return `<div class="postit ok"><div class="pt-h">🎉 밀린 보강이 하나도 없어요!</div><div class="pt-s">결강이 생기면 여기에 빨갛게 붙어요</div></div>`;
  return `<div class="postit"><div class="pt-h">🚨 보강 잡아야 해요! <span class="pt-n">${wait.length}</span></div><div class="pt-s">학원에 연락해서 보강 날짜를 잡아 주세요</div>`+
    wait.map(x=>{const a=acOf(x.acad),n=Math.round((pd(t)-pd(x.date))/864e5);
      return `<div class="pt-i" data-ed="${x.id}" style="--c:${a.color}"><span class="ic">${a.ico}</span><span class="tx"><b>${esc(a.name)}</b>${kidTag(a)}<span class="d">❌ ${fmt(x.date)} 결강${x.reason?' · '+esc(x.reason):''}${x.memo?'<br>📝 '+esc(x.memo):''}</span></span><span class="dd ${n>=14?'hot':''}">${n>0?n+'일째<br>밀림':n===0?'오늘<br>결강':'예정<br>'+(-n)+'일 뒤'}</span><button class="sbtn y" data-mk="${x.id}">보강<br>잡기</button></div>`}).join('')+
    (soon.length?`<div class="pt-soon">⭐ 곧 보강: `+soon.map(x=>{const a=acOf(x.acad);return `${a.ico} ${esc(a.name)} <b>${fmt(x.mk)}</b>${x.mkTime?' '+esc(x.mkTime):''}`}).join(' · ')+`</div>`:'')+`</div>`;
}
function renderCal(){
  if(!ym){const n=new Date();ym=[n.getFullYear(),n.getMonth()]}
  const [y,m]=ym, first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  let h=pendHTML()+`<div class="card"><div class="calh"><button id="pm">◀</button><b>${y}년 ${m+1}월</b><span><button class="today" id="tm">오늘</button> <button id="nm">▶</button></span></div><div class="grid">`;
  h+=[...DOW].map(c=>`<div class="dow">${c}</div>`).join('');
  const t=today();
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=ds(d);
    if(i>=35&&d.getMonth()!==m)break;
    const ev=eventsOn(s),rg=regularOn(s);
    const cls=['day',d.getMonth()!==m?'out':'',s===t?'td':'',s===selDay?'sel':'',d.getDay()===0?'su':'',d.getDay()===6?'sa':''].join(' ');
    h+=`<button class="${cls}" data-d="${s}"><span class="n">${d.getDate()}</span><span class="evs">`+
      ev.map(e=>{const a=acOf(e.x.acad);return `<span class="ev ${e.k}${e.k==='mk'&&status(e.x)==='done'?' dn':''}" title="${esc(a.name)}">${a.ico}</span>`}).join('')+
      rg.map(a=>`<span class="ev rg" title="${esc(a.name)} 정규">${a.ico}</span>`).join('')+`</span></button>`;
  }
  h+=`</div><div class="legend"><span><span class="ev ab">🎹</span> 결강</span><span><span class="ev mk">🎹</span> 보강 예정</span><span><span class="ev mk dn">🎹</span> 보강 끝</span><span><span class="ev rg" style="opacity:.4">🎹</span> 원래 수업</span></div></div>`;
  h+=`<div class="card" id="dayCard"></div>`;
  $('#main').innerHTML=h;
  $('#pm').onclick=()=>{ym=m?[y,m-1]:[y-1,11];renderCal()};
  $('#nm').onclick=()=>{ym=m<11?[y,m+1]:[y+1,0];renderCal()};
  $('#tm').onclick=()=>{ym=null;selDay=today();renderCal()};
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selDay=b.dataset.d;renderCal();$('#dayCard').scrollIntoView({behavior:'smooth',block:'nearest'})});
  renderDay();
  const pt=$('#main .postit');if(pt)bindItems(pt);
}
function renderDay(){const d=selDay||today();const box=$('#dayCard');
  const ev=eventsOn(d),rg=regularOn(d);
  let h=`<div class="dhead"><b>${fmt(d)} <span style="font-size:14px;color:var(--sub)">${dday(d)}</span></b><button class="sbtn" data-a="ab">❌ 결강</button><button class="sbtn y" data-a="mk">⭐ 보강</button></div>`;
  if(!ev.length&&!rg.length)h+=`<div class="empty"><span class="big">🌤️</span>이 날은 학원 일정이 없어요</div>`;
  ev.forEach(e=>h+=itemHTML(e.x,e.k));
  rg.forEach(a=>h+=`<div class="item" style="--c:${a.color};opacity:.75"><div class="ic">${a.ico}</div><div class="tx"><b>${esc(a.name)}</b>${kidTag(a)}<div>원래 수업${a.time?' · '+esc(a.time):''}</div></div><button class="sbtn gr" data-q="${a.id}">못 가요</button></div>`);
  box.innerHTML=h;
  box.querySelector('[data-a=ab]').onclick=()=>openAbs(null,{date:d});
  box.querySelector('[data-a=mk]').onclick=()=>openMk(null,d);
  box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openAbs(null,{date:d,acad:b.dataset.q}));
  bindItems(box);
}
function kidTag(a){if(S.kids.length<2||kid!=='all')return'';const k=kidOf(a.kid);return k?`<span class="tag t-none">${k.em} ${esc(k.name)}</span>`:''}
function itemHTML(x,k){const a=acOf(x.acad),st=status(x);
  let sub,btn='';
  if(k==='mk'){sub=`<span class="lk">❌ ${fmt(x.date)} 결강분</span>${x.mkTime?' · ⏰ '+esc(x.mkTime):''}`;}
  else if(k==='ab'){sub=`${x.reason?esc(x.reason):''}${x.mk&&!x.none?` → <span class="lk">⭐ ${fmt(x.mk)} 보강</span>${x.mkTime?' '+esc(x.mkTime):''}`:''}${x.none?' → 보강 없음':''}`;
    if(st==='wait')btn=`<button class="sbtn y" data-mk="${x.id}">보강 잡기</button>`;}
  else{ // list
    sub=`❌ ${fmt(x.date)} 결강${x.reason?' · '+esc(x.reason):''}`+(x.mk&&!x.none?`<br><span class="lk">⭐ ${fmt(x.mk)} ${x.mkTime?esc(x.mkTime)+' ':''}보강 · ${dday(x.mk)}</span>`:'');
    if(st==='wait')btn=`<button class="sbtn y" data-mk="${x.id}">보강 잡기</button>`;}
  const tg=k==='mk'?['보강','t-mk']:k==='ab'?['결강','t-ab']:ST[st];
  const memo=x.memo?`<div>📝 ${esc(x.memo)}</div>`:'';
  return `<div class="item" style="--c:${a.color}" data-ed="${x.id}"><div class="ic">${a.ico}</div><div class="tx"><b>${esc(a.name)}</b><span class="tag ${tg[1]}">${tg[0]}</span>${k!=='list'&&k!=='mk'&&st==='wait'?'<span class="tag t-wait">대기</span>':''}${kidTag(a)}<div>${sub}</div>${memo}</div>${btn}</div>`;
}
function bindItems(box){
  box.querySelectorAll('[data-mk]').forEach(b=>b.onclick=e=>{e.stopPropagation();openAbs(b.dataset.mk,null,true)});
  box.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>openAbs(b.dataset.ed));
}
function renderList(){const A=visAbs(),t=today();
  const wait=A.filter(x=>status(x)==='wait').sort((a,b)=>a.date.localeCompare(b.date));
  const plan=A.filter(x=>status(x)==='plan').sort((a,b)=>a.mk.localeCompare(b.mk));
  const past=A.filter(x=>['done','none'].includes(status(x))).sort((a,b)=>(b.mk||b.date).localeCompare(a.mk||a.date));
  let h=pendHTML(true)+`<div class="card"><h3>⭐ 다가오는 보강 <small>${plan.length}개</small></h3>`;
  h+=plan.length?plan.map(x=>itemHTML(x,'list')).join(''):`<div class="empty">잡혀 있는 보강이 없어요</div>`;
  h+=`</div><div class="card"><h3>✅ 지난 기록 <small>${past.length}개</small></h3>`;
  h+=past.length?past.slice(0,showAll?999:8).map(x=>itemHTML(x,'list')).join('')+(past.length>8&&!showAll?`<button class="sbtn gr" id="more" style="width:100%">더 보기 (${past.length-8}개)</button>`:''):`<div class="empty">아직 기록이 없어요</div>`;
  h+=`</div>`;
  $('#main').innerHTML=h;bindItems($('#main'));
  const mo=$('#more');if(mo)mo.onclick=()=>{showAll=true;renderList()};
}
let showAll=false;

  h+=L.map(a=>{const ab=S.abs.filter(x=>x.acad===a.id),w=ab.filter(x=>status(x)==='wait').length;

/* ---------- modals ---------- */
function openSheet(h){$('#sheet').innerHTML=h;$('#ov').classList.add('on');$('#sheet').scrollTop=0;const x=$('#sheet .x');if(x)x.onclick=closeSheet}
function closeSheet(){$('#ov').classList.remove('on')}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};

function openAc(id){
  const a=id?{...acOf(id)}:{id:uid(),name:'',ico:'⭐',color:COLORS[S.acads.length%COLORS.length],days:[],time:'',kid:kid!=='all'?kid:(S.kids[0]||{}).id,auto:true};
  const draw=()=>{
    let h=`<h2>${id?'✏️ 학원 고치기':'➕ 학원 추가'}<button class="x">✕</button></h2>
    <div class="prev" style="background:color-mix(in srgb,${a.color} 15%,#fff)"><span class="ic">${a.ico}</span><b class="j" style="font-size:19px">${esc(a.name)||'학원 이름'}</b></div>
    <div class="lbl">학원 이름</div><input class="inp" id="fn" value="${esc(a.name)}" placeholder="예) 피아노, 수영, 눈높이 수학" maxlength="20">`;
    if(S.kids.length>1)h+=`<div class="lbl">누가 다녀요?</div><div class="chips">${S.kids.map(k=>`<button class="chip ${a.kid===k.id?'on':''}" data-kid="${k.id}"><span class="e">${k.em}</span>${esc(k.name)}</button>`).join('')}</div>`;
    h+=`<div class="lbl">아이콘 <span class="note">(이름을 쓰면 저절로 골라져요)</span></div><div class="icons">${ICONS.map(e=>`<button class="${a.ico===e?'on':''}" data-ic="${e}">${e}</button>`).join('')}</div>
    <div class="lbl">색깔</div><div class="colors">${COLORS.map(c=>`<button class="${a.color===c?'on':''}" data-co="${c}" style="background:${c}"></button>`).join('')}</div>
    <div class="lbl">가는 요일 <span class="note">(달력에 원래 수업이 연하게 보여요)</span></div><div class="days">${[...DOW].map((c,i)=>`<button class="${a.days.includes(i)?'on':''}" data-dw="${i}">${c}</button>`).join('')}</div>
    <div class="lbl">시간 (선택)</div><input class="inp" id="ft" value="${esc(a.time)}" placeholder="예) 4시~5시" maxlength="20">
    <button class="go" id="ok">${id?'저장':'추가하기'}</button>${id?'<button class="del" id="dl">🗑️ 이 학원 지우기</button>':''}`;
    openSheet(h);
    const fn=$('#fn');
    fn.oninput=()=>{a.name=fn.value;if(a.auto){const s=suggest(a.name);if(s&&s!==a.ico){a.ico=s;const p=fn.selectionStart;draw();$('#fn').focus();$('#fn').setSelectionRange(p,p);return}}document.querySelector('.prev b').textContent=a.name||'학원 이름'};
    $('#ft').oninput=e=>a.time=e.target.value;
    document.querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{a.ico=b.dataset.ic;a.auto=false;draw()});
    document.querySelectorAll('[data-co]').forEach(b=>b.onclick=()=>{a.color=b.dataset.co;draw()});
    document.querySelectorAll('[data-dw]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dw;a.days=a.days.includes(i)?a.days.filter(x=>x!==i):[...a.days,i];draw()});
    document.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{a.kid=b.dataset.kid;draw()});
    $('#ok').onclick=()=>{if(!a.name.trim()){toast('학원 이름을 써 주세요');return}a.name=a.name.trim();delete a.auto;
      const i=S.acads.findIndex(x=>x.id===a.id);if(i>=0)S.acads[i]=a;else S.acads.push(a);
      closeSheet();toast(`${a.ico} ${a.name} ${id?'저장':'추가'}했어요`);render()};
    const dl=$('#dl');if(dl)dl.onclick=()=>{if(dl.dataset.c){S.acads=S.acads.filter(x=>x.id!==a.id);S.abs=S.abs.filter(x=>x.acad!==a.id);closeSheet();render()}else{dl.dataset.c=1;dl.textContent='한 번 더 누르면 결강·보강 기록까지 지워져요'}};
  };draw();
}

function openAbs(id,pre,focusMk){
  if(!S.acads.length){toast('먼저 학원을 추가해 주세요');tab='ac';render();return}
  const old=id?S.abs.find(x=>x.id===id):null;
  const L=visAcads().length?visAcads():S.acads;
  const x=old?{...old}:{id:uid(),acad:(pre&&pre.acad)||(L.length===1?L[0].id:''),date:(pre&&pre.date)||today(),reason:'',mk:'',mkTime:'',none:false,memo:''};
  let wantMk=!!(x.mk||x.none||focusMk);
  const draw=()=>{const a=acOf(x.acad);
    let h=`<h2>${old?'✏️ 결강·보강 고치기':'❌ 결강 넣기'}<button class="x">✕</button></h2>
    <div class="lbl">어느 학원?</div><div class="chips">${L.map(a=>`<button class="chip ${x.acad===a.id?'on':''}" data-a="${a.id}"><span class="e">${a.ico}</span>${esc(a.name)}${S.kids.length>1&&kid==='all'&&kidOf(a.kid)?' '+kidOf(a.kid).em:''}</button>`).join('')}</div>
    <div class="lbl">❌ 결강 날짜</div><input type="date" class="inp" id="fd" value="${x.date}">
    <div class="lbl">왜 빠졌어요? (선택)</div><div class="chips">${REASONS.map(([e,t])=>`<button class="chip ${x.reason===t?'on':''}" data-r="${t}"><span class="e">${e}</span>${t}</button>`).join('')}</div>
    <label class="toggle"><input type="checkbox" id="wm" ${wantMk?'checked':''}> ⭐ 보강 날짜도 정해졌어요</label>`;
    if(wantMk)h+=`<div class="mkbox"><div class="lbl">⭐ 보강 날짜</div><div class="row"><input type="date" class="inp" id="fm" value="${x.mk||''}" ${x.none?'disabled':''}><input class="inp" id="fmt" value="${esc(x.mkTime)}" placeholder="시간 예) 5시" ${x.none?'disabled':''}></div>
      <label class="toggle" style="background:#f4f0ec;color:#8a7a72"><input type="checkbox" id="fno" ${x.none?'checked':''}> 보강 안 해요 (이월·환불·취소)</label></div>`;
    h+=`<div class="lbl">메모 (선택)</div><input class="inp" id="fme" value="${esc(x.memo)}" placeholder="예) 선생님이 문자 주신대요" maxlength="60">
    <button class="go" id="ok">${old?'저장':'넣기'}</button>${old?'<button class="del" id="dl">🗑️ 이 기록 지우기</button>':''}`;
    openSheet(h);
    document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{x.acad=b.dataset.a;draw()});
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{x.reason=x.reason===b.dataset.r?'':b.dataset.r;draw()});
    $('#fd').onchange=e=>x.date=e.target.value;
    $('#fme').oninput=e=>x.memo=e.target.value;
    $('#wm').onchange=e=>{wantMk=e.target.checked;if(!wantMk){x.mk='';x.mkTime='';x.none=false}draw()};
    if(wantMk){$('#fm').onchange=e=>x.mk=e.target.value;$('#fmt').oninput=e=>x.mkTime=e.target.value;$('#fno').onchange=e=>{x.none=e.target.checked;if(x.none){x.mk='';x.mkTime=''}draw()};
      if(focusMk&&!x.mk){focusMk=false;setTimeout(()=>{const f=$('#fm');f&&f.scrollIntoView({block:'center'})},50)}}
    $('#ok').onclick=()=>{if(!x.acad){toast('학원을 골라 주세요');return}if(!x.date){toast('결강 날짜를 넣어 주세요');return}
      if(x.mk&&x.mk<x.date&&!confirmLate){confirmLate=true;toast('보강이 결강보다 빨라요. 맞으면 한 번 더 눌러요');return}
      confirmLate=false;
      const i=S.abs.findIndex(y=>y.id===x.id);if(i>=0)S.abs[i]=x;else S.abs.push(x);
      const a=acOf(x.acad);closeSheet();
      toast(x.mk?`${a.ico} 보강 ${fmt(x.mk)} 저장! ⭐`:x.none?`${a.ico} 저장했어요`:`${a.ico} ${fmt(x.date)} 결강 저장 · 보강 대기 🔴`);
      jump(x.mk||x.date);render()};
    const dl=$('#dl');if(dl)dl.onclick=()=>{if(dl.dataset.c){S.abs=S.abs.filter(y=>y.id!==x.id);closeSheet();render()}else{dl.dataset.c=1;dl.textContent='한 번 더 누르면 지워져요'}};
  };draw();
}
let confirmLate=false;
function jump(d){selDay=d;const p=pd(d);ym=[p.getFullYear(),p.getMonth()]}

function openMk(_,date){
  const wait=visAbs().filter(x=>status(x)==='wait').sort((a,b)=>a.date.localeCompare(b.date));
  if(!wait.length){openSheet(`<h2>⭐ 보강 넣기<button class="x">✕</button></h2><div class="empty"><span class="big">🎉</span>보강을 기다리는 결강이 없어요!<br>먼저 결강을 넣으면 여기서 보강 날짜를 잡을 수 있어요.</div><button class="go" id="toAb">❌ 결강 먼저 넣기</button>`);$('#toAb').onclick=()=>openAbs(null,{});return}
  let sel=wait[0].id,mk=date||today(),tm='';
  const draw=()=>{
    openSheet(`<h2>⭐ 보강 넣기<button class="x">✕</button></h2>
    <div class="lbl">어느 결강의 보강이에요? <span class="note">(보강 대기 ${wait.length}개)</span></div>
    <div class="pick">${wait.map(x=>{const a=acOf(x.acad);return `<div class="item ${sel===x.id?'on':''}" style="--c:${a.color}" data-s="${x.id}"><div class="ic">${a.ico}</div><div class="tx"><b>${esc(a.name)}</b>${kidTag(a)}<div>❌ ${fmt(x.date)} 결강 · ${dday(x.date)}${x.reason?' · '+esc(x.reason):''}</div></div>${sel===x.id?'<span style="font-size:22px">✔️</span>':''}</div>`}).join('')}</div>
    <div class="lbl">⭐ 보강 날짜</div><div class="row"><input type="date" class="inp" id="fm" value="${mk}"><input class="inp" id="fmt" value="${esc(tm)}" placeholder="시간 예) 5시"></div>
    <button class="go y" id="ok">⭐ 보강 저장</button>`);
    document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sel=b.dataset.s;draw()});
    $('#fm').onchange=e=>mk=e.target.value;$('#fmt').oninput=e=>tm=e.target.value;
    $('#ok').onclick=()=>{if(!mk){toast('보강 날짜를 넣어 주세요');return}const x=S.abs.find(y=>y.id===sel);x.mk=mk;x.mkTime=tm;x.none=false;
      const a=acOf(x.acad);closeSheet();toast(`${a.ico} ${a.name} 보강 ${fmt(mk)} 저장! ⭐`);jump(mk);render()};
  };draw();
}

function openSet(){
  const draw=()=>{
    openSheet(`<h2>⚙️ 설정<button class="x">✕</button></h2>
    <div class="lbl">👧 아이 <span class="note">(2명 이상이면 위에 아이별 탭이 생겨요)</span></div>
    ${S.kids.map(k=>`<div class="row" style="margin-bottom:6px;align-items:center"><button class="chip" style="flex:none;font-size:22px" data-ke="${k.id}">${k.em}</button><input class="inp" data-kn="${k.id}" value="${esc(k.name)}" maxlength="10"><button class="sbtn gr" style="flex:none" data-kd="${k.id}">빼기</button></div>`).join('')}
    <div class="row"><input class="inp" id="nk" placeholder="아이 이름 (예: 연우)" maxlength="10"><button class="sbtn" style="flex:none" id="ak">➕ 추가</button></div>
    <div class="lbl">☁️ 온라인 저장 · 가족 링크</div>
    <div class="share"><div>기록은 <b>온라인에 저장</b>돼요. 아래 <b>우리 가족 링크</b>로 열면 카톡·사파리·다른 폰 어디서든 같은 기록이 보여요.<br><span class="note">⚠️ 링크를 아는 사람은 누구나 볼 수 있으니 가족끼리만 나눠요</span></div>
      <div class="code">우리 가족 코드 <b>${S.code}</b> <span class="st">${{ok:'✅ 저장됨',busy:'⏳ 저장 중',off:'⚠️ 인터넷 확인'}[syncState]||''}</span></div>
      <button class="go" id="shr" style="margin-top:10px">🔗 우리 가족 링크 보내기 (카톡)</button>
      <details style="margin-top:10px"><summary class="note">다른 가족 코드로 바꾸기</summary><div class="row" style="margin-top:6px"><input class="inp" id="cin" placeholder="코드 12자리" maxlength="16"><button class="sbtn" style="flex:none" id="cgo">불러오기</button></div></details></div>
    <div class="lbl">📱 홈 화면에 앱처럼 두기</div>
    <div class="share" style="background:#fff4e0">${/KAKAOTALK/i.test(navigator.userAgent)?`카톡 안에서는 홈 화면에 못 넣어요. 먼저 👇<button class="go" id="extb" style="margin:6px 0">🌐 인터넷 앱으로 열기</button><span class="note">(안 되면 오른쪽 아래 ⋯/공유 → 「다른 브라우저로 열기」)</span><br>`:''}
     <b>아이폰</b>: 사파리 아래 <b>공유 버튼(⬆️)</b> → <b>「홈 화면에 추가」</b><br>
     <b>갤럭시</b>: 크롬/삼성인터넷 <b>⋮ 메뉴</b> → <b>「홈 화면에 추가」</b> (또는 「앱 설치」)<br>
     <span class="note">📝 「보강 수첩」 아이콘이 생기고 카톡이랑 따로 열려요. 기록은 우리 가족 코드로 그대로 보여요.</span></div>
    <div class="lbl">💾 파일 백업 <span class="note">(혹시 몰라 파일로도 저장해 둘 수 있어요)</span></div>
    <div class="row"><button class="sbtn g" id="ex">📤 파일로 저장</button><button class="sbtn" id="im">📥 파일 불러오기</button></div>
    <input type="file" id="imf" accept=".json,application/json" style="display:none">
    <div class="lbl">🧹 정리</div>
    <button class="sbtn gr" id="clr" style="width:100%">6개월 넘은 지난 기록 지우기</button>
    <p class="note" style="margin-top:14px">📒 학원 보강 수첩 · 보강 날짜가 지나면 저절로 ✅ 완료로 바뀌어요.</p>`);
    document.querySelectorAll('[data-kn]').forEach(i=>i.oninput=()=>{kidOf(i.dataset.kn).name=i.value;save();renderKids()});
    document.querySelectorAll('[data-ke]').forEach(b=>b.onclick=()=>{const k=kidOf(b.dataset.ke);k.em=KIDEM[(KIDEM.indexOf(k.em)+1)%KIDEM.length];draw();render()});
    document.querySelectorAll('[data-kd]').forEach(b=>b.onclick=()=>{const id=b.dataset.kd;if(S.acads.some(a=>a.kid===id)&&!b.dataset.c){b.dataset.c=1;b.textContent='학원도 있어요! 한 번 더';return}
      S.kids=S.kids.filter(k=>k.id!==id);const rest=S.kids[0];S.acads.forEach(a=>{if(a.kid===id)a.kid=rest?rest.id:undefined});if(kid===id)kid='all';draw();render()});
    $('#ak').onclick=()=>{const n=$('#nk').value.trim();if(!n)return;const k={id:uid(),name:n,em:KIDEM[S.kids.length%KIDEM.length]};
      if(!S.kids.length)S.acads.forEach(a=>a.kid=k.id);S.kids.push(k);draw();render()};
    $('#shr').onclick=shareLink;
    const xb=$('#extb');if(xb)xb.onclick=()=>{location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(shareURL())};
    $('#cgo').onclick=()=>{const v=$('#cin').value.trim().toLowerCase();if(!/^[a-z0-9]{10,16}$/.test(v)){toast('코드를 확인해 주세요');return}S.code=v;history.replaceState(null,'',shareURL());pull('hard').then(r=>{toast(r==='got'?'☁️ 불러왔어요!':'이 코드엔 기록이 없어서 지금 기록을 올렸어요');closeSheet();render()})};
    $('#ex').onclick=()=>{const b=new Blob([JSON.stringify({app:'academy-makeup',v:1,at:new Date().toISOString(),data:{kids:S.kids,acads:S.acads,abs:S.abs}},null,1)],{type:'application/json'});
      const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=`학원보강수첩_${today()}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
    $('#im').onclick=()=>$('#imf').click();
    $('#imf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const d=j.data||j;if(!Array.isArray(d.acads))throw 0;
      S.kids=d.kids||[];S.acads=d.acads;S.abs=d.abs||[];kid='all';closeSheet();toast('불러왔어요!');render()}catch(_){toast('이 파일은 못 읽겠어요')}};
    $('#clr').onclick=()=>{const c=new Date();c.setMonth(c.getMonth()-6);const cs=ds(c);const n=S.abs.length;
      S.abs=S.abs.filter(x=>!(['done','none'].includes(status(x))&&(x.mk||x.date)<cs));toast(`${n-S.abs.length}개 지웠어요`);render()};
  };draw();
}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('#fabA').onclick=()=>openAbs(null,{date:tab==='cal'&&selDay?selDay:today()});
$('#fabM').onclick=()=>openMk(null,tab==='cal'&&selDay&&selDay>=today()?selDay:null);
$('#setBtn').onclick=openSet;
$('#cloud').onclick=openSet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
selDay=today();
render();
initSync();
</script>
</body>
</html>
